name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v, for example 0.1.0"
        required: true
      target:
        description: "Branch or commit SHA to release from"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Create tag and release
        uses: actions/github-script@v7
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET: ${{ inputs.target }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.INPUT_VERSION.trim();
            const target = process.env.INPUT_TARGET.trim() || "main";
            const tag = `v${version}`;

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let targetSha = target;
            if (!/^[0-9a-f]{40}$/i.test(target)) {
              const ref = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${target}`,
              });
              targetSha = ref.data.object.sha;
            }

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
              core.setFailed(`Tag ${tag} already exists.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: targetSha,
            });

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: targetSha,
              name: tag,
              generate_release_notes: true,
            });
