name: Sync Labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.json"
      - ".github/workflows/sync-labels.yml"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync-labels:
    name: Sync repository labels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create and update labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelsPath = path.join(process.env.GITHUB_WORKSPACE, ".github", "labels.json");
            const desiredLabels = JSON.parse(fs.readFileSync(labelsPath, "utf8"));

            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });

            const existingByName = new Map(existingLabels.map((label) => [label.name, label]));

            for (const label of desiredLabels) {
              const existing = existingByName.get(label.name);

              if (existing) {
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: existing.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description,
                });
                core.info(`Updated label: ${label.name}`);
                continue;
              }

              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label.name,
                color: label.color,
                description: label.description,
              });
              core.info(`Created label: ${label.name}`);
            }
