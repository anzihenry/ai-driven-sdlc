name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-template:
    name: Validate Template Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate template contract
        run: python3 .github/scripts/validate_template_contract.py

      - name: Guard against macOS metadata
        run: |
          if find . -name ".DS_Store" -print | grep -q .; then
            echo ".DS_Store files should not be committed"
            find . -name ".DS_Store" -print
            exit 1
          fi

      - name: Reminder for stack-specific checks
        run: |
          echo "Template contract validation passed."
          echo "Core template files are required; recommended and optional surfaces are validated when present."
