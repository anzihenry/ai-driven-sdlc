name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-template:
    name: Validate Template Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          required_files=(
            "README.md"
            ".editorconfig"
            ".gitignore"
            ".github/dependabot.yml"
            ".github/labeler.yml"
            ".github/labels.json"
            ".github/release-drafter.yml"
            "doc/README.md"
            "doc/specs/project-brief.md"
            "doc/specs/feature-spec-template.md"
            "doc/decisions/ADR-template.md"
            "doc/process/ai-workflow.md"
            "doc/process/delivery-checklist.md"
            "doc/process/versioning-and-releases.md"
            "doc/process/release-checklist.md"
            "prompts/feature-implementation.md"
            "prompts/code-review.md"
            "src/README.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

      - name: Validate markdown templates
        run: |
          markdown_files=(
            "README.md"
            "doc/README.md"
            "doc/specs/project-brief.md"
            "doc/specs/feature-spec-template.md"
            "doc/decisions/ADR-template.md"
            "doc/process/ai-workflow.md"
            "doc/process/delivery-checklist.md"
            "prompts/feature-implementation.md"
            "prompts/code-review.md"
            "src/README.md"
            ".github/PULL_REQUEST_TEMPLATE.md"
            ".github/ISSUE_TEMPLATE/bug_report.md"
            ".github/ISSUE_TEMPLATE/feature_request.md"
            ".github/ISSUE_TEMPLATE/task_request.md"
            "CONTRIBUTING.md"
          )

          for file in "${markdown_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Markdown file is missing or empty: $file"
              exit 1
            fi
          done

      - name: Guard against macOS metadata
        run: |
          if find . -name ".DS_Store" -print | grep -q .; then
            echo ".DS_Store files should not be committed"
            find . -name ".DS_Store" -print
            exit 1
          fi

      - name: Reminder for stack-specific checks
        run: |
          echo "Template validation passed."
          echo "Add stack-specific lint, test, and build jobs after the application stack is chosen."
