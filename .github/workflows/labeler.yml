name: PR Labeler

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read
  pull-requests: write

jobs:
  label-pr:
    name: Apply PR labels
    runs-on: ubuntu-latest

    steps:
      - name: Apply labels from changed files and branch names
        uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
